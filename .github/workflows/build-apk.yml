# Compila la APK en GitHub, sin Android Studio ni PC.
# Usa Gradle directo, no necesita gradlew en el repo.
# Sin setup-android: ubuntu-latest ya trae el SDK y setup-android@v3 falla
# intentando instalar el paquete viejo 'tools' que Google quitó.
name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ahorro-vpn-apk
          path: app/build/outputs/apk/debug/app-debug.apk
